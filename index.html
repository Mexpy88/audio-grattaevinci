<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c60aa">
<title>Magazzino Servizi Ospedalieri</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf3f8}
#warehouseApp{display:block;width:100%;height:100dvh;border:0;background:#edf3f8;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease}
body.bootReady #warehouseApp{opacity:1;visibility:visible;pointer-events:auto}
#bootSplash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#edf3f8;padding:24px;transition:opacity .18s ease}
#bootSplash.bootLeaving{opacity:0;pointer-events:none}
.bootCard{width:min(88vw,430px);background:linear-gradient(145deg,#fff,#e8f1f7);border:1px solid #d9e5ee;border-radius:30px;padding:32px 26px 28px;text-align:center;box-shadow:0 18px 48px #17314d18}
.bootLogo{display:block;width:min(100%,330px);height:auto;margin:0 auto 22px;object-fit:contain;background:transparent}
.bootTitle{font:900 27px/1.08 system-ui,-apple-system,"Segoe UI",sans-serif;color:#2c60aa;margin:0 0 9px}
.bootStatus{font:750 14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#65788c;min-height:20px}
.bootDots{display:flex;justify-content:center;gap:7px;margin-top:20px}
.bootDots i{display:block;width:9px;height:9px;border-radius:50%;background:#2c60aa;animation:bootPulse 1s ease-in-out infinite}
.bootDots i:nth-child(2){animation-delay:.16s}.bootDots i:nth-child(3){animation-delay:.32s}
@keyframes bootPulse{0%,100%{opacity:.28;transform:scale(.82)}50%{opacity:1;transform:scale(1)}}
@media(max-width:430px){.bootCard{border-radius:25px;padding:27px 20px 24px}.bootTitle{font-size:24px}.bootLogo{width:min(100%,285px)}}
</style>
</head>
<body>
<div id="bootSplash" role="status" aria-live="polite">
  <div class="bootCard">
    <img src="logo-transparent.png?v=20260826-1" alt="Servizi Ospedalieri" class="bootLogo">
    <div class="bootTitle">Gestione Magazzino</div>
    <div id="bootStatus" class="bootStatus">Caricamento in corso…</div>
    <div class="bootDots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</div>
<iframe id="warehouseApp" src="base.html?v=20260814-0727" title="Gestione Magazzino" allow="clipboard-read; clipboard-write; web-share; camera; microphone"></iframe>
<script src="early-pin-eye.js?v=20260825-early1"></script>
<script src="top-level-live-dictation.js?v=20260825-scrollfix1"></script>
<script src="top-level-gboard-ux.js?v=20260825-scrollfix1"></script>
<script src="top-level-dialog-scroll-fix.js?v=20260825-scrollfix1"></script>
<script>
(function(){
  const VERSION='20260826-logo-backnav1';
  const frame=document.getElementById('warehouseApp');
  const splash=document.getElementById('bootSplash');
  const bootStatus=document.getElementById('bootStatus');
  let revealed=false;

  function setBootStatus(text){if(bootStatus&&bootStatus.textContent!==text)bootStatus.textContent=text}
  function revealApp(){
    if(revealed)return;revealed=true;
    document.body.classList.add('bootReady');
    if(splash){splash.classList.add('bootLeaving');splash.setAttribute('aria-hidden','true');setTimeout(()=>{splash.style.display='none'},220)}
  }
  function failBoot(err){
    console.error('Estensione magazzino non caricata',err);
    setBootStatus('Avvio completato con funzioni ridotte.');
    try{frame.contentWindow?.warehouseToast?.('Errore caricamento moduli: '+(err?.message||err),'error')}catch{}
    setTimeout(revealApp,450);
  }
  function nextPaint(){return new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))}
  function addStyle(d,id,href){if(d.getElementById(id))return;const l=d.createElement('link');l.id=id;l.rel='stylesheet';l.href=href;d.head.appendChild(l)}
  function addScript(d,id,src){return new Promise((resolve,reject)=>{if(d.getElementById(id)){resolve();return}const s=d.createElement('script');s.id=id;s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error('Impossibile caricare '+src));d.body.appendChild(s)})}

  frame.addEventListener('load',async()=>{
    try{
      const d=frame.contentDocument;if(!d)throw new Error('Interfaccia non disponibile');
      setBootStatus('Preparazione interfaccia…');
      window.WarehouseEarlyPinEye?.install?.();
      d.querySelectorAll('img[alt="Servizi Ospedalieri"]').forEach(img=>img.setAttribute('src','logo-transparent.png?v='+VERSION));
      if(!d.getElementById('logoFixStyles')){const style=d.createElement('style');style.id='logoFixStyles';style.textContent=`.logoButton{max-width:56vw;overflow:visible!important;background:transparent!important}.logoButton img{width:min(230px,56vw)!important;height:auto!important;max-width:none!important;object-fit:contain!important;object-position:left center!important;background:transparent!important}.heroLogo{width:min(100%,430px)!important;height:auto!important;object-fit:contain!important;background:transparent!important}.hero{overflow:hidden}@media(max-width:430px){.logoButton img{width:min(210px,55vw)!important;max-width:none!important}}@media(max-width:360px){.logoButton img{width:min(175px,52vw)!important;max-width:none!important}}`;d.head.appendChild(style)}
      addStyle(d,'stockEditCss','modifica.css?v=20260814-0756');
      addStyle(d,'warehouseFixCss','fixes.css?v=20260814-0845');
      addStyle(d,'localMasterCss','local-master.css?v='+VERSION);
      addStyle(d,'superUxCss','super-ux.css?v='+VERSION);
      addStyle(d,'requestCartonsCss','request-cartons.css?v='+VERSION);
      addStyle(d,'voiceCommandsCss','voice-commands.css?v='+VERSION);

      setBootStatus('Caricamento moduli…');
      await addScript(d,'stockEditJs','modifica.js?v=20260814-0756');
      await addScript(d,'warehouseFixJs','fixes.js?v=20260814-0845');
      await addScript(d,'jsZipJs','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
      await addScript(d,'xlsxDownloadFixJs','xlsx-download-fix.js?v='+VERSION);
      await addScript(d,'localMasterJs','local-master.js?v='+VERSION);
      await addScript(d,'localMasterOoxmlJs','local-master-ooxml.js?v='+VERSION);
      await addScript(d,'localMasterUxJs','local-master-ux.js?v='+VERSION);
      await addScript(d,'uiHardeningJs','ui-hardening.js?v='+VERSION);
      await addScript(d,'superUxJs','super-ux.js?v='+VERSION);
      await addScript(d,'stockRectificationsJs','stock-rectifications.js?v='+VERSION);
      await addScript(d,'requestCartonsJs','request-cartons.js?v='+VERSION);
      await addScript(d,'dashboardLinksJs','dashboard-links.js?v='+VERSION);
      await addScript(d,'dashboardCollapseJs','dashboard-collapse.js?v='+VERSION);
      await addScript(d,'masterSchemaV4Js','warehouse-master-schema-v4.js?v='+VERSION);
      await addScript(d,'rectUppercaseFixJs','rectification-uppercase-fix.js?v='+VERSION);
      await addScript(d,'rectificationFlagsJs','rectification-flags.js?v='+VERSION);
      await addScript(d,'excelStockSearchJs','excel-stock-search-sheet.js?v='+VERSION);
      await addScript(d,'excelStockSearchDetailFixJs','excel-stock-search-detail-fix.js?v='+VERSION);
      await addScript(d,'cleanFormsDefaultNewJs','clean-forms-default-new.js?v='+VERSION);
      await addScript(d,'masterImportUiCleanupJs','master-import-ui-cleanup.js?v='+VERSION);
      await addScript(d,'sessionCycleFixJs','session-cycle-fix.js?v='+VERSION);
      await addScript(d,'validationSoundsJs','validation-sounds.js?v='+VERSION);
      await addScript(d,'voiceCommandsJs','voice-commands.js?v='+VERSION);
      await addScript(d,'flexPositionV2Js','flex-position-v2.js?v='+VERSION);
      await addScript(d,'gboardVoiceNormalizerJs','gboard-voice-normalizer.js?v='+VERSION);
      await addScript(d,'voiceTopBrokerClientJs','voice-top-broker-client.js?v='+VERSION);
      await addScript(d,'manualEditRequestRefreshFixJs','manual-edit-request-refresh-fix.js?v='+VERSION);
      await addScript(d,'requestInteractionPerformanceFixJs','request-interaction-performance-fix.js?v='+VERSION);
      await addScript(d,'requestCompletionWorkflowJs','request-completion-workflow.js?v='+VERSION);
      await addScript(d,'masterGenerationGuardJs','master-generation-guard-v2.js?v='+VERSION);
      await addScript(d,'managerialV2Js','managerial-v2.js?v='+VERSION);
      await addScript(d,'managerialV2PolishJs','managerial-v2-polish.js?v='+VERSION);
      await addScript(d,'masterPanelMinimizeV2Js','master-panel-minimize-v2.js?v='+VERSION);
      await addScript(d,'uxPolishV3Js','ux-polish-v3.js?v='+VERSION);
      await addScript(d,'stickyTopBackJs','sticky-top-back.js?v='+VERSION);

      setBootStatus('Finalizzazione…');
      await new Promise(resolve=>setTimeout(resolve,100));
      try{
        frame.contentWindow?.WarehouseUIHealth?.run?.();
        frame.contentWindow?.WarehouseDashboardLinks?.decorate?.();
        frame.contentWindow?.WarehouseMasterCollapse?.install?.();
        frame.contentWindow?.WarehouseRectificationFlags?.install?.();
        frame.contentWindow?.WarehouseExcelStockSearch?.install?.();
        frame.contentWindow?.WarehouseExcelStockSearchDetailFix?.install?.();
        frame.contentWindow?.WarehouseCleanFormsDefaultNew?.install?.();
        frame.contentWindow?.WarehouseMasterImportUiCleanup?.install?.();
        frame.contentWindow?.WarehouseSessionCycleFix?.install?.();
        frame.contentWindow?.WarehouseValidationSounds?.install?.();
        frame.contentWindow?.WarehouseVoiceCommands?.installUi?.();
        frame.contentWindow?.WarehouseFlexPositionV2?.install?.();
        frame.contentWindow?.WarehouseGboardNormalizer?.install?.();
        frame.contentWindow?.WarehouseVoiceTopClient?.install?.();
        frame.contentWindow?.WarehouseManualEditRequestRefreshFix?.install?.();
        frame.contentWindow?.WarehouseRequestInteractionPerformanceFix?.install?.();
        frame.contentWindow?.WarehouseRequestCompletionWorkflow?.install?.();
        frame.contentWindow?.WarehouseMasterGenerationGuard?.install?.();
        frame.contentWindow?.WarehouseManagerialV2?.install?.();
        frame.contentWindow?.WarehouseManagerialV2Polish?.install?.();
        frame.contentWindow?.WarehouseMasterPanelMinimizeV2?.install?.();
        frame.contentWindow?.WarehouseUxPolishV3?.install?.();
        frame.contentWindow?.WarehouseStickyTopBack?.install?.();
      }catch(err){console.warn('Finalizzazione UI parziale',err)}
      await nextPaint();
      revealApp();
    }catch(err){failBoot(err)}
  });

  setTimeout(()=>{if(!revealed)setBootStatus('Caricamento dati e interfaccia…')},3500);
})();
</script>
</body>
</html>
