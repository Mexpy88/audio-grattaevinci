<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c60aa">
<title>Magazzino Servizi Ospedalieri</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf3f8}
#warehouseApp{display:block;width:100%;height:100dvh;border:0;background:#edf3f8}
</style>
</head>
<body>
<iframe id="warehouseApp" src="base.html?v=20260814-0727" title="Gestione Magazzino" allow="clipboard-read; clipboard-write; web-share"></iframe>
<script>
(function(){
  const frame=document.getElementById('warehouseApp');
  frame.addEventListener('load',()=>{
    try{
      const d=frame.contentDocument;
      if(!d)return;

      d.querySelectorAll('img[alt="Servizi Ospedalieri"]').forEach(img=>{
        img.setAttribute('src','logo-full.svg?v=20260814-0756');
      });

      if(!d.getElementById('logoFixStyles')){
        const style=d.createElement('style');
        style.id='logoFixStyles';
        style.textContent=`
          .logoButton{max-width:56vw;overflow:visible!important}
          .logoButton img{width:min(230px,56vw)!important;height:auto!important;max-width:none!important;object-fit:contain!important;object-position:left center!important}
          .heroLogo{width:min(100%,430px)!important;height:auto!important;object-fit:contain!important}
          @media(max-width:430px){.logoButton img{width:min(210px,55vw)!important;max-width:none!important}}
          @media(max-width:360px){.logoButton img{width:min(175px,52vw)!important;max-width:none!important}}
        `;
        d.head.appendChild(style);
      }

      if(!d.getElementById('stockEditCss')){
        const link=d.createElement('link');
        link.id='stockEditCss';
        link.rel='stylesheet';
        link.href='modifica.css?v=20260814-0756';
        d.head.appendChild(link);
      }
      if(!d.getElementById('warehouseFixCss')){
        const link=d.createElement('link');
        link.id='warehouseFixCss';
        link.rel='stylesheet';
        link.href='fixes.css?v=20260814-0845';
        d.head.appendChild(link);
      }

      if(!d.getElementById('stockEditJs')){
        const script=d.createElement('script');
        script.id='stockEditJs';
        script.src='modifica.js?v=20260814-0756';
        script.async=false;
        d.body.appendChild(script);
      }
      if(!d.getElementById('warehouseFixJs')){
        const script=d.createElement('script');
        script.id='warehouseFixJs';
        script.src='fixes.js?v=20260814-0845';
        script.async=false;
        d.body.appendChild(script);
      }
    }catch(err){
      console.error('Estensione magazzino non caricata',err);
    }
  });
})();
</script>
</body>
</html>
