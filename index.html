<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c60aa">
<title>Magazzino Servizi Ospedalieri</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf3f8}
#warehouseApp{display:block;width:100%;height:100dvh;border:0;background:#edf3f8}
</style>
</head>
<body>
<iframe id="warehouseApp" src="base.html?v=20260814-0727" title="Gestione Magazzino" allow="clipboard-read; clipboard-write; web-share"></iframe>
<script>
(function(){
  const VERSION='20260819-0850';
  const frame=document.getElementById('warehouseApp');
  function addStyle(d,id,href){if(d.getElementById(id))return;const l=d.createElement('link');l.id=id;l.rel='stylesheet';l.href=href;d.head.appendChild(l)}
  function addScript(d,id,src){return new Promise((resolve,reject)=>{if(d.getElementById(id)){resolve();return}const s=d.createElement('script');s.id=id;s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error('Impossibile caricare '+src));d.body.appendChild(s)})}
  frame.addEventListener('load',async()=>{
    try{
      const d=frame.contentDocument;if(!d)return;
      d.querySelectorAll('img[alt="Servizi Ospedalieri"]').forEach(img=>img.setAttribute('src','logo-full.svg?v=20260814-0756'));
      if(!d.getElementById('logoFixStyles')){const style=d.createElement('style');style.id='logoFixStyles';style.textContent=`.logoButton{max-width:56vw;overflow:visible!important}.logoButton img{width:min(230px,56vw)!important;height:auto!important;max-width:none!important;object-fit:contain!important;object-position:left center!important}.heroLogo{width:min(100%,430px)!important;height:auto!important;object-fit:contain!important}@media(max-width:430px){.logoButton img{width:min(210px,55vw)!important;max-width:none!important}}@media(max-width:360px){.logoButton img{width:min(175px,52vw)!important;max-width:none!important}}`;d.head.appendChild(style)}
      addStyle(d,'stockEditCss','modifica.css?v=20260814-0756');
      addStyle(d,'warehouseFixCss','fixes.css?v=20260814-0845');
      addStyle(d,'localMasterCss','local-master.css?v='+VERSION);
      await addScript(d,'stockEditJs','modifica.js?v=20260814-0756');
      await addScript(d,'warehouseFixJs','fixes.js?v=20260814-0845');
      await addScript(d,'localMasterJs','local-master.js?v='+VERSION);
      await addScript(d,'localMasterUxJs','local-master-ux.js?v='+VERSION);
    }catch(err){console.error('Estensione magazzino non caricata',err);try{frame.contentWindow?.warehouseToast?.('Errore caricamento moduli: '+(err.message||err),'error')}catch{}}
  });
})();
</script>
</body>
</html>
