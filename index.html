<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf4f8"><title>Magazzino NOVA</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#edf4f8;color:#17314d}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(88vw,430px);background:#fff;border:1px solid #d7e4ee;border-radius:28px;padding:30px;text-align:center;box-shadow:0 18px 48px #17314d18}.card b{display:block;font-size:27px;color:#2c60aa}.card span{display:block;margin-top:9px;color:#65788c;font-weight:700}.dots{margin:22px auto 0;width:42px;height:10px;background:radial-gradient(circle,#2c60aa 3px,transparent 4px) 0 50%/14px 10px repeat-x;animation:p .9s infinite alternate}@keyframes p{to{opacity:.25}}.err{color:#9d3b34}</style></head><body><div class="boot"><div class="card"><b>Magazzino NOVA</b><span id="status">Avvio applicazione…</span><div class="dots"></div></div></div><script>const PARTS=["bundle/seg-000.txt", "bundle/seg-001.txt", "bundle/seg-002.txt", "bundle/seg-003.txt", "bundle/seg-004.txt", "bundle/seg-005.txt", "bundle/seg-006.txt", "bundle/seg-007.txt", "bundle/seg-008.txt", "bundle/seg-009.txt", "bundle/seg-010.txt", "bundle/seg-011.txt", "bundle/seg-012.txt", "bundle/seg-013.txt", "bundle/seg-014.txt", "bundle/seg-015.txt", "bundle/seg-016.txt", "bundle/seg-017.txt", "bundle/seg-018.txt"];const EXPECTED='b76b0db9269db61e793254961fbfdf96c81311d2e5b01e26e2b0978819190481';async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};(async()=>{try{const chunks=await Promise.all(PARTS.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error('File NOVA mancante: '+p);return r.text()}));const html=chunks.join('');if(await sha256(html)!==EXPECTED)throw new Error('Integrità build NOVA non valida.');document.open();document.write(html);document.close()}catch(e){console.error(e);const s=document.getElementById('status');s.className='err';s.textContent='Avvio non riuscito: '+e.message}})();</script></body></html>
