<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Magazzino - Servizi Ospedalieri</title><style>html,body{margin:0;min-height:100%;background:#edf3f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;color:#2c60aa;font-weight:800;text-align:center;padding:30px}</style></head><body><div id="boot">Caricamento…</div><script>(async()=>{try{const parts=await Promise.all([0,1,2,3,4,5].map(async i=>(await (await fetch(`p${i}.txt`,{cache:'no-store'})).text()).trim()));const h=parts.join('');if(h.length%2)throw new Error('Pacchetto non valido');const b=new Uint8Array(h.length/2);for(let i=0;i<h.length;i+=2)b[i/2]=parseInt(h.slice(i,i+2),16);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><h2>Errore caricamento</h2><p>'+String(e.message||e)+'</p></div>'}})();</script></body></html>
