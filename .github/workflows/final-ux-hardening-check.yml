name: Final UX Hardening Check
on:
  push:
    branches: [warehouse-app-remoto-dev-firstpaint-registry-export-master-20260827]
  workflow_dispatch:
jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check final-ux-hardening-v1.js
          node --check ux-polish-v3.js
          node --check registry-movements-fix-v1.js
          node --check request-floating-confirm-v1.js
          node --check premium-dashboard-v2.js
          node --check premium-dashboard-v2-fix.js
          node --check role-dashboard-v1.js
          node --check role-dashboard-v1-patch.js
          node --check request-cartons.js
          node --check request-completion-workflow.js
          node --check stock-rectifications.js
          node --check managerial-v2.js
      - name: Validate final UX hardening
        run: |
          node tests/final-ux-hardening-v1-runtime.mjs
          node tests/boot-splash-runtime.mjs
          node tests/fastboot-runtime.mjs
          node tests/ux-polish-v3-runtime.mjs
          node tests/registry-movements-fix-runtime.mjs
          node tests/premium-dashboard-v2-runtime.mjs
          node tests/role-dashboard-v1-runtime.mjs
          node tests/request-floating-confirm-v1-runtime.mjs
          node tests/sticky-top-back-logo-runtime.mjs
      - name: Request cartons
        run: node tests/request-cartons-integrity.mjs
      - name: Request completion
        run: node tests/request-completion-workflow-runtime.mjs
      - name: Request interaction performance
        run: node tests/request-interaction-performance-runtime.mjs
      - name: Managerial V2
        run: node tests/managerial-v2-runtime.mjs
      - name: Managerial V2 polish
        run: node tests/managerial-v2-polish-runtime.mjs
      - name: Assisted count V3
        run: node tests/stock-control-assisted-v3-runtime.mjs
      - name: Assisted count UX V4
        run: node tests/stock-control-assisted-ux-v4-runtime.mjs
      - name: Assisted count UX V5
        run: node tests/stock-control-assisted-ux-v5-runtime.mjs
      - name: Grouped rectification
        run: node tests/rectification-grouped-splash-runtime.mjs
      - name: Master generation guard
        run: node tests/master-generation-guard-runtime.mjs
      - name: Run V1 regression
        run: |
          node tests/ui-button-integrity.mjs
          node tests/ui-hardening-runtime.mjs
          node tests/super-ux-integrity.mjs
          node tests/dashboard-shortcuts.mjs
          node tests/dashboard-collapse-integrity.mjs
          node tests/xlsx-download-integrity.mjs
          node tests/stock-rectifications-integrity.mjs
          node tests/stock-rectifications-runtime.mjs
          node tests/master-schema-v4-runtime.mjs
          node tests/rectification-quantity-uppercase-runtime.mjs
          node tests/rectification-flags-runtime.mjs
          node tests/excel-stock-search-sheet-runtime.mjs
          node tests/excel-stock-search-detail-fix-runtime.mjs
          node tests/clean-forms-default-new-runtime.mjs
          node tests/master-import-ui-cleanup-runtime.mjs
          node tests/session-cycle-fix-runtime.mjs
          node tests/validation-sounds-runtime.mjs
          node tests/flex-position-v2-runtime.mjs
