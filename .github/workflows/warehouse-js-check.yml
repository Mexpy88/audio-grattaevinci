name: Warehouse JS Check
on:
  push:
    branches: [warehouse-ai-live]
    paths:
      - 'index.html'
      - 'base.html'
      - 'local-master.js'
      - 'local-master-ooxml.js'
      - 'local-master-ux.js'
      - 'ui-hardening.js'
      - 'tests/ui-button-integrity.mjs'
      - 'tests/ui-hardening-runtime.mjs'
      - 'modifica.js'
      - 'fixes.js'
      - '.github/workflows/warehouse-js-check.yml'
  pull_request:
    branches: [warehouse-ai-live]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check active JavaScript syntax
        run: |
          node --check modifica.js
          node --check fixes.js
          node --check local-master.js
          node --check local-master-ooxml.js
          node --check local-master-ux.js
          node --check ui-hardening.js
          node --check tests/ui-button-integrity.mjs
          node --check tests/ui-hardening-runtime.mjs
      - name: Check UI button handlers
        run: node tests/ui-button-integrity.mjs
      - name: Check hardened master import runtime
        run: node tests/ui-hardening-runtime.mjs
