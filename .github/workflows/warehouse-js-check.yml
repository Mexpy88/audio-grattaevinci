          node --check tests/ui-hardening-runtime.mjs
          node --check tests/super-ux-integrity.mjs
          node --check tests/request-cartons-integrity.mjs
          node --check tests/request-interaction-performance-runtime.mjs
          node --check tests/dashboard-shortcuts.mjs
          node --check tests/dashboard-collapse-integrity.mjs
          node --check tests/xlsx-download-integrity.mjs
          node --check tests/stock-rectifications-integrity.mjs
          node --check tests/stock-rectifications-runtime.mjs
          node --check tests/master-schema-v4-runtime.mjs
          node --check tests/rectification-quantity-uppercase-runtime.mjs
          node --check tests/rectification-flags-runtime.mjs
          node --check tests/excel-stock-search-sheet-runtime.mjs
          node --check tests/excel-stock-search-detail-fix-runtime.mjs
          node --check tests/clean-forms-default-new-runtime.mjs
          node --check tests/master-import-ui-cleanup-runtime.mjs
