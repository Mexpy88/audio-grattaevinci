          node --check tests/flex-position-v2-runtime.mjs
          node --check tests/live-text-dictation-ux.mjs
          node --check tests/manual-edit-request-refresh-runtime.mjs
      - name: Check UI button handlers
        run: node tests/ui-button-integrity.mjs
      - name: Check hardened master import runtime
        run: node tests/ui-hardening-runtime.mjs
      - name: Check Super UX features
        run: node tests/super-ux-integrity.mjs
      - name: Check request carton semantics
        run: node tests/request-cartons-integrity.mjs
      - name: Run instant request interaction runtime
        run: node tests/request-interaction-performance-runtime.mjs
      - name: Check dashboard shortcuts
