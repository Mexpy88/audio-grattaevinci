      - 'voice-commands.css'
      - 'tests/ui-button-integrity.mjs'
      - 'tests/ui-hardening-runtime.mjs'
      - 'tests/super-ux-integrity.mjs'
      - 'tests/request-cartons-integrity.mjs'
      - 'tests/request-interaction-performance-runtime.mjs'
      - 'tests/dashboard-shortcuts.mjs'
      - 'tests/dashboard-collapse-integrity.mjs'
      - 'tests/xlsx-download-integrity.mjs'
      - 'tests/stock-rectifications-integrity.mjs'
