name: Warehouse JS Check
on:
  push:
    branches: [warehouse-ai-live, warehouse-app-remoto-session-counters-pin-eye-20260824]
    paths:
      - 'index.html'
      - 'base.html'
      - 'local-master.js'
      - 'local-master-ooxml.js'
      - 'local-master-ux.js'
      - 'ui-hardening.js'
      - 'super-ux.js'
      - 'super-ux.css'
      - 'request-cartons.js'
      - 'request-cartons.css'
      - 'dashboard-links.js'
      - 'dashboard-collapse.js'
      - 'xlsx-download-fix.js'
      - 'stock-rectifications.js'
      - 'warehouse-master-schema-v4.js'
      - 'rectification-uppercase-fix.js'
      - 'rectification-flags.js'
      - 'excel-stock-search-sheet.js'
      - 'excel-stock-search-detail-fix.js'
      - 'clean-forms-default-new.js'
      - 'master-import-ui-cleanup.js'
      - 'session-cycle-fix.js'
      - 'tests/ui-button-integrity.mjs'
      - 'tests/ui-hardening-runtime.mjs'
      - 'tests/super-ux-integrity.mjs'
      - 'tests/request-cartons-integrity.mjs'
      - 'tests/dashboard-shortcuts.mjs'
      - 'tests/dashboard-collapse-integrity.mjs'
      - 'tests/xlsx-download-integrity.mjs'
      - 'tests/stock-rectifications-integrity.mjs'
      - 'tests/stock-rectifications-runtime.mjs'
      - 'tests/master-schema-v4-runtime.mjs'
      - 'tests/rectification-quantity-uppercase-runtime.mjs'
      - 'tests/rectification-flags-runtime.mjs'
      - 'tests/excel-stock-search-sheet-runtime.mjs'
      - 'tests/excel-stock-search-detail-fix-runtime.mjs'
      - 'tests/clean-forms-default-new-runtime.mjs'
      - 'tests/master-import-ui-cleanup-runtime.mjs'
      - 'tests/session-cycle-fix-runtime.mjs'
      - 'modifica.js'
      - 'fixes.js'
      - '.github/workflows/warehouse-js-check.yml'
  pull_request:
    branches: [warehouse-ai-live]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check active JavaScript syntax
        run: |
          node --check modifica.js
          node --check fixes.js
          node --check local-master.js
          node --check local-master-ooxml.js
          node --check local-master-ux.js
          node --check ui-hardening.js
          node --check super-ux.js
          node --check request-cartons.js
          node --check dashboard-links.js
          node --check dashboard-collapse.js
          node --check xlsx-download-fix.js
          node --check stock-rectifications.js
          node --check warehouse-master-schema-v4.js
          node --check rectification-uppercase-fix.js
          node --check rectification-flags.js
          node --check excel-stock-search-sheet.js
          node --check excel-stock-search-detail-fix.js
          node --check clean-forms-default-new.js
          node --check master-import-ui-cleanup.js
          node --check session-cycle-fix.js
          node --check tests/ui-button-integrity.mjs
          node --check tests/ui-hardening-runtime.mjs
          node --check tests/super-ux-integrity.mjs
          node --check tests/request-cartons-integrity.mjs
          node --check tests/dashboard-shortcuts.mjs
          node --check tests/dashboard-collapse-integrity.mjs
          node --check tests/xlsx-download-integrity.mjs
          node --check tests/stock-rectifications-integrity.mjs
          node --check tests/stock-rectifications-runtime.mjs
          node --check tests/master-schema-v4-runtime.mjs
          node --check tests/rectification-quantity-uppercase-runtime.mjs
          node --check tests/rectification-flags-runtime.mjs
          node --check tests/excel-stock-search-sheet-runtime.mjs
          node --check tests/excel-stock-search-detail-fix-runtime.mjs
          node --check tests/clean-forms-default-new-runtime.mjs
          node --check tests/master-import-ui-cleanup-runtime.mjs
          node --check tests/session-cycle-fix-runtime.mjs
      - name: Check UI button handlers
        run: node tests/ui-button-integrity.mjs
      - name: Check hardened master import runtime
        run: node tests/ui-hardening-runtime.mjs
      - name: Check Super UX features
        run: node tests/super-ux-integrity.mjs
      - name: Check request carton semantics
        run: node tests/request-cartons-integrity.mjs
      - name: Check dashboard shortcuts
        run: node tests/dashboard-shortcuts.mjs
      - name: Check dashboard collapse
        run: node tests/dashboard-collapse-integrity.mjs
      - name: Check XLSX download semantics
        run: node tests/xlsx-download-integrity.mjs
      - name: Check stock rectification semantics
        run: node tests/stock-rectifications-integrity.mjs
      - name: Run stock rectification runtime
        run: node tests/stock-rectifications-runtime.mjs
      - name: Run Master V4 schema runtime
        run: node tests/master-schema-v4-runtime.mjs
      - name: Run rectification quantity and uppercase runtime
        run: node tests/rectification-quantity-uppercase-runtime.mjs
      - name: Run rectification checklist flags runtime
        run: node tests/rectification-flags-runtime.mjs
      - name: Run Excel stock search sheet runtime
        run: node tests/excel-stock-search-sheet-runtime.mjs
      - name: Run Excel stock search detail compatibility runtime
        run: node tests/excel-stock-search-detail-fix-runtime.mjs
      - name: Run clean forms/manual NUOVO runtime
        run: node tests/clean-forms-default-new-runtime.mjs
      - name: Run Master import UX cleanup runtime
        run: node tests/master-import-ui-cleanup-runtime.mjs
      - name: Run session counter and PIN eye runtime
        run: node tests/session-cycle-fix-runtime.mjs
