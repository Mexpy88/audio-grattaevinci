name: NOVA Clean Build
on:
  push:
    branches: [magazzino-nova-clean-20260828]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nova-clean-build
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Excel table verifier
        run: npm install --no-save --package-lock=false exceljs@4.4.0
      - name: Generate V14 lifecycle + Excel shell
        run: node build-v14.mjs
      - name: Verify NOVA baseline contracts
        run: node verify-package.mjs
      - name: Verify NOVA V14 lifecycle
        run: node verify-v14.mjs
      - name: Verify real Excel table roundtrip
        run: node verify-excel-v14.mjs
      - name: Publish generated direct shell
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build(nova): publish V14 lifecycle + Excel shell"
            git push origin HEAD:magazzino-nova-clean-20260828
          else
            echo "V14 direct shell already current"
          fi
