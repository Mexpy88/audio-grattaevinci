name: NOVA Clean Build
on:
  push:
    branches: [magazzino-nova-clean-20260828]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nova-clean-build
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate premium direct static shell
        run: node build-direct.mjs
      - name: Verify NOVA V6 premium mobile UX
        run: node verify-package.mjs
      - name: Publish generated direct shell
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build(nova): publish premium mobile V6 shell"
            git push origin HEAD:magazzino-nova-clean-20260828
          else
            echo "Premium direct shell already current"
          fi
