name: NOVA Clean Build
on:
  push:
    branches: [magazzino-nova-clean-20260828]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify NOVA package V3
        run: node verify-package.mjs
