name: NOVA Clean Build
on:
  push:
    branches: [magazzino-nova-clean-20260828]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nova-clean-build
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install integration verifiers
        run: npm install --no-save --package-lock=false exceljs@4.4.0 xlsx@0.18.5 jszip@3.10.1 fast-xml-parser@5.2.5
      - name: Generate V19 consolidated shell
        run: node build-v19.mjs
      - name: Verify NOVA baseline contracts
        run: node verify-package.mjs
      - name: Verify V17 exact position engine still intact
        run: node verify-v17.mjs
      - name: Verify V19 Master position import and reimport baseline
        run: node verify-v18.mjs
      - name: Verify V19 WMS rectification and count lifecycle
        run: node verify-v19.mjs
      - name: Verify V19 complete XLSX package and user tables
        run: node verify-excel-v19.mjs
      - name: Publish generated V19 shell
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build(nova): publish V19 WMS consolidation shell"
            git push origin HEAD:magazzino-nova-clean-20260828
          else
            echo "V19 direct shell already current"
          fi
