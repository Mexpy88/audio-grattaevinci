name: Grouped Rectification and Splash Check
on:
  push:
    branches: [warehouse-app-remoto-dev-rectification-grouped-splash-20260826]
  workflow_dispatch:
jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check active JavaScript syntax
        run: |
          node --check managerial-v2.js
          node --check managerial-v2-polish.js
          node --check stock-control-assisted-v3.js
          node --check stock-control-assisted-ux-v4.js
          node --check stock-control-assisted-ux-v5.js
          node --check stock-rectification-grouped-ux-v2.js
          node --check master-panel-minimize-v2.js
          node --check ux-polish-v3.js
          node --check sticky-top-back.js
          node --check modifica.js
          node --check fixes.js
          node --check early-pin-eye.js
          node --check local-master.js
          node --check local-master-ooxml.js
          node --check local-master-ux.js
          node --check master-generation-guard-v2.js
          node --check ui-hardening.js
          node --check super-ux.js
          node --check request-cartons.js
          node --check request-interaction-performance-fix.js
          node --check request-completion-workflow.js
          node --check dashboard-links.js
          node --check dashboard-collapse.js
          node --check xlsx-download-fix.js
          node --check stock-rectifications.js
          node --check warehouse-master-schema-v4.js
          node --check rectification-uppercase-fix.js
          node --check rectification-flags.js
          node --check excel-stock-search-sheet.js
          node --check excel-stock-search-detail-fix.js
          node --check clean-forms-default-new.js
          node --check master-import-ui-cleanup.js
          node --check session-cycle-fix.js
          node --check validation-sounds.js
          node --check voice-commands.js
          node --check flex-position-v2.js
          node --check manual-edit-request-refresh-fix.js
          node --check tests/rectification-grouped-splash-runtime.mjs
      - name: Run grouped rectification and managerial tests
        run: |
          node tests/rectification-grouped-splash-runtime.mjs
          node tests/managerial-v2-runtime.mjs
          node tests/managerial-v2-polish-runtime.mjs
          node tests/stock-control-assisted-v3-runtime.mjs
          node tests/stock-control-assisted-ux-v4-runtime.mjs
          node tests/stock-control-assisted-ux-v5-runtime.mjs
          node tests/master-panel-minimize-v2-runtime.mjs
          node tests/ux-polish-v3-runtime.mjs
          node tests/boot-splash-runtime.mjs
          node tests/sticky-top-back-logo-runtime.mjs
          node tests/fastboot-runtime.mjs
      - name: Run V1 regression tests
        run: |
          node tests/ui-button-integrity.mjs
          node tests/ui-hardening-runtime.mjs
          node tests/super-ux-integrity.mjs
          node tests/request-cartons-integrity.mjs
          node tests/request-interaction-performance-runtime.mjs
          node tests/request-completion-workflow-runtime.mjs
          node tests/master-generation-guard-runtime.mjs
          node tests/dashboard-shortcuts.mjs
          node tests/dashboard-collapse-integrity.mjs
          node tests/xlsx-download-integrity.mjs
          node tests/stock-rectifications-integrity.mjs
          node tests/stock-rectifications-runtime.mjs
          node tests/master-schema-v4-runtime.mjs
          node tests/rectification-quantity-uppercase-runtime.mjs
          node tests/rectification-flags-runtime.mjs
          node tests/excel-stock-search-sheet-runtime.mjs
          node tests/excel-stock-search-detail-fix-runtime.mjs
          node tests/clean-forms-default-new-runtime.mjs
          node tests/master-import-ui-cleanup-runtime.mjs
          node tests/session-cycle-fix-runtime.mjs
          node tests/validation-sounds-runtime.mjs
          node tests/voice-commands-runtime.mjs
          node tests/flex-position-v2-runtime.mjs
          node tests/live-text-dictation-ux.mjs
          node tests/manual-edit-request-refresh-runtime.mjs
