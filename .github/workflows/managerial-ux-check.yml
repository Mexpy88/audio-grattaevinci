name: Managerial UX Full Check
on:
  push:
    branches: [warehouse-app-remoto-dev-managerial-ux-20260826]
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check active JavaScript syntax
        run: |
          node --check managerial-workflows.js
          node --check master-panel-minimize.js
          node --check master-generation-guard-v2.js
          node --check request-completion-workflow.js
          node --check manual-edit-request-refresh-fix.js
          node --check flex-position-v2.js
          node --check stock-rectifications.js
          node --check super-ux.js
          node --check local-master.js
      - name: Run managerial workflow runtime
        run: node tests/managerial-workflows-runtime.mjs
      - name: Run Master panel minimize runtime
        run: node tests/master-panel-minimize-runtime.mjs
      - name: Run all existing runtime and integrity tests
        run: |
          set -e
          for f in tests/*.mjs; do
            case "$f" in
              tests/managerial-workflows-runtime.mjs|tests/master-panel-minimize-runtime.mjs) continue ;;
            esac
            echo "=== $f ==="
            node "$f"
          done
