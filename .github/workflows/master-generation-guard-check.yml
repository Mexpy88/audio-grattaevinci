name: Master Generation Guard Check
on:
  push:
    branches: [warehouse-app-remoto-dev-master-generation-20260826]
    paths:
      - 'index.html'
      - 'master-generation-guard.js'
      - 'tests/master-generation-guard-runtime.mjs'
      - '.github/workflows/master-generation-guard-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'master-generation-guard.js'
      - 'tests/master-generation-guard-runtime.mjs'
      - '.github/workflows/master-generation-guard-check.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check master-generation-guard.js
          node --check tests/master-generation-guard-runtime.mjs
      - name: Rollback and generation runtime
        run: node tests/master-generation-guard-runtime.mjs
