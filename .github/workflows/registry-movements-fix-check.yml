name: Registry Movimenti Fix Check
on:
  push:
    branches:
      - warehouse-app-remoto-dev-registry-movements-fix-20260827
      - warehouse-app-remoto-dev-surgical-registry-export-20260827
      - warehouse-app-remoto-dev-contextual-mobile-export-20260827
      - warehouse-app-remoto-dev-master-refactor-clean-20260827
      - warehouse-app-remoto-dev-teramo-title-master-plus-20260827
      - warehouse-app-remoto-dev-registry-premium-ux-20260827
      - warehouse-app-remoto-dev-goods-receipt-20260827
  workflow_dispatch:
jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check master-controller-v2.js
          node --check ui-hardening.js
          node --check registry-movements-fix-v1.js
          node --check goods-receipt-v1.js
          node --check goods-receipt-v2-fix.js
          node --check ux-polish-v3.js
          node --check request-floating-confirm-v1.js
          node --check premium-dashboard-v2.js
          node --check premium-dashboard-v2-fix.js
          node --check role-dashboard-v1.js
          node --check role-dashboard-v1-patch.js
          node --check request-cartons.js
          node --check request-completion-workflow.js
      - name: Validate registry, Master and premium UX
        run: |
          node tests/master-controller-v2-runtime.mjs
          node tests/registry-movements-fix-runtime.mjs
          node tests/goods-receipt-v1-runtime.mjs
          node tests/goods-receipt-v2-fix-runtime.mjs
          node tests/mobile-export-context-runtime.mjs
          node tests/request-floating-confirm-v1-runtime.mjs
          node tests/premium-dashboard-v2-runtime.mjs
          node tests/teramo-mobile-polish-runtime.mjs
          node tests/role-dashboard-v1-runtime.mjs
          node tests/sticky-top-back-logo-runtime.mjs
      - name: Validate requests and stock workflows
        run: |
          node tests/request-cartons-integrity.mjs
          node tests/request-completion-workflow-runtime.mjs
          node tests/request-interaction-performance-runtime.mjs
          node tests/managerial-v2-runtime.mjs
          node tests/managerial-v2-polish-runtime.mjs
          node tests/stock-control-assisted-v3-runtime.mjs
          node tests/stock-control-assisted-ux-v4-runtime.mjs
          node tests/stock-control-assisted-ux-v5-runtime.mjs
          node tests/rectification-grouped-splash-runtime.mjs
          node tests/master-generation-guard-runtime.mjs
      - name: V1 UI core
        run: |
          node tests/ui-button-integrity.mjs
          node tests/ui-hardening-runtime.mjs
          node tests/super-ux-integrity.mjs
      - name: V1 dashboard and xlsx
        run: |
          node tests/dashboard-shortcuts.mjs
          node tests/dashboard-collapse-integrity.mjs
          node tests/xlsx-download-integrity.mjs
      - name: V1 stock rectifications
        run: |
          node tests/stock-rectifications-integrity.mjs
          node tests/stock-rectifications-runtime.mjs
      - name: V1 Master and search
        run: |
          node tests/master-schema-v4-runtime.mjs
          node tests/excel-stock-search-sheet-runtime.mjs
          node tests/excel-stock-search-detail-fix-runtime.mjs
      - name: V1 session and devices
        run: |
          node tests/session-cycle-fix-runtime.mjs
          node tests/validation-sounds-runtime.mjs
          node tests/flex-position-v2-runtime.mjs