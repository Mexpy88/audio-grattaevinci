name: WMS V2 Windows Demo
on:
  push:
    branches: [magazzino-so-wms-v2-demo]
    paths:
      - 'wms-v2/**'
      - '.github/workflows/wms-v2-windows-demo.yml'
  pull_request:
    paths:
      - 'wms-v2/**'
      - '.github/workflows/wms-v2-windows-demo.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wms-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: wms-v2/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run WMS V2 tests
        run: npm test
      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Magazzino-SO-Demo-Windows
          path: wms-v2/dist/*.exe
          if-no-files-found: error
          retention-days: 30
